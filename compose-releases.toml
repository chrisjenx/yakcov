# Compose Multiplatform release channels
# Each section defines a channel to build and publish against.
# The release script and CI matrix read this file to determine which
# Compose versions to target.
#
# Keys:
#   compose          - Compose Multiplatform plugin + dependency version (required)
#   compose-material3 - Material3 artifact version (required, often differs from compose)
#   kotlin           - Kotlin version override (optional, inherits from libs.versions.toml if omitted)
#   jvm-target       - Android JVM bytecode target override (optional, inherits "1.8" from libs.versions.toml)
#   xcode            - Xcode version for Apple CI builds (optional, uses runner default if omitted)
#   track            - Upstream channel followed by scripts/check-compose-updates.py:
#                      "stable" or "prerelease" (optional; defaults to "stable" for the
#                      [stable] section and "prerelease" for any other section)

[stable]
compose = "1.12.0"
compose-material3 = "1.12.0-alpha03"
# kotlin omitted -> inherits 2.4.10 (latest stable) from libs.versions.toml, comfortably above
# the >= 2.3.10 that Compose 1.11 native/web requires. Verified: 1.11.1's artifacts build and
# test clean on 2.4.10 across all five targets, and jvmTarget 1.8 is still accepted.
# Required: Compose 1.11's iOS skiko links against a newer SDK than the macos runner
# default (Xcode 16.4 / iOS 18.5), which fails with "framework 'UIUtilities' not found".
# Xcode 26.3 is installed on the macos-latest runner and links cleanly. Do not remove.
xcode = "26.3"

# The [next] (beta) channel rides the next Compose development line ahead of stable.
# Its CI matrix leg is continue-on-error (keyed on channel == "next" in checks.yml),
# so a broken pre-release surfaces without blocking the CI-Gate / merges.
[next]
track = "prerelease"
compose = "1.12.0-rc01"
compose-material3 = "1.12.0-alpha03"
# Pinned to the same latest-stable Kotlin as [stable] (which inherits it from
# libs.versions.toml). Kept declared rather than omitted so check-compose-updates.py
# keeps managing it — the script only tracks `kotlin` for channels that state it.
# Both channels sharing one compiler is what lets a single committed ABI dump be
# valid everywhere; see the abiValidation block in library/build.gradle.kts.
kotlin = "2.4.10"
# Compose 1.12 androidx artifacts are JVM 11 bytecode; the library's Android target
# must inline into 11. [stable] omits this and inherits jvmTarget=1.8 from libs.versions.toml.
jvm-target = "11"
xcode = "26.3"
