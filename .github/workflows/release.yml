name: Release
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options:
          - all
          - stable
          - next
      dry-run:
        description: 'Dry run (build only, no publish or tag)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  Build-Matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Parse compose-releases.toml
        id: parse
        env:
          CHANNEL_FILTER: ${{ inputs.channel }}
        run: |
          matrix=$(./scripts/lib-release.sh --json-matrix "$CHANNEL_FILTER")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Parsed matrix: $matrix"

  Publish:
    needs: Build-Matrix
    # macOS is required: Kotlin/Native cannot build the iOS targets on Linux, so
    # publishing from ubuntu would silently drop the iOS klibs from the release
    # (kotlin.native.ignoreDisabledTargets=true). macOS cross-compiles every target.
    runs-on: macos-latest
    environment: maven-central
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.Build-Matrix.outputs.matrix) }}
    name: Publish (${{ matrix.channel }} → ${{ matrix.tag }})
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Select Xcode version
        if: ${{ matrix.xcode != '' }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - name: Setup Java JDK
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'
      - name: Patch Compose versions
        run: ./scripts/lib-release.sh --patch "${{ matrix.channel }}"
      - name: Publish to Maven Central
        if: ${{ inputs.dry-run == false }}
        run: ./gradlew :library:publishAndReleaseToMavenCentral --no-configuration-cache -PpublishVersion="${{ matrix.tag }}"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - name: Dry-run build
        if: ${{ inputs.dry-run == true }}
        # checkKotlinAbi is excluded: library/api/ dumps are toolchain-specific (each Kotlin
        # version emits a slightly different surface), so a dump generated on stable cannot match
        # a non-stable channel's compiler. The unmatrixed `Checks-Api` job owns that gate and runs
        # on every PR; re-running it here would only ever fail for the channel mismatch.
        run: ./gradlew :library:build -x :library:checkKotlinAbi --no-configuration-cache -PpublishVersion="${{ matrix.tag }}"
      - name: Create and push git tag
        if: ${{ inputs.dry-run == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ matrix.tag }}"
          git push origin "${{ matrix.tag }}"
      - name: Create GitHub Release
        if: ${{ inputs.dry-run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pushed tag is not a Release on its own — create one so the Releases page tracks
          # what's on Maven Central. Prerelease keys off the channel (the next/prerelease channel),
          # NOT the tag suffix (stable's "-N" is just collision-avoidance, not a prerelease marker).
          prerelease=""
          if [ "${{ matrix.channel }}" != "stable" ]; then prerelease="--prerelease"; fi
          gh release create "${{ matrix.tag }}" \
            --title "${{ matrix.tag }}" \
            --generate-notes \
            --verify-tag \
            $prerelease

  Summary:
    if: always()
    needs: [Build-Matrix, Publish]
    runs-on: ubuntu-latest
    steps:
      - name: Release summary
        env:
          PUBLISH_RESULT: ${{ needs.Publish.result }}
        run: |
          echo "## Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Channel**: ${{ inputs.channel }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dry run**: ${{ inputs.dry-run }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUBLISH_RESULT" = "success" ]; then
            echo "All publish jobs succeeded." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Some publish jobs failed or were skipped. Check individual job logs." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
