name: Checks
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  checks: write
jobs:
  Build-Matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Parse compose-releases.toml
        id: parse
        run: |
          matrix=$(./scripts/lib-release.sh --json-matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Parsed matrix: $matrix"

  Checks-JS:
    needs: Build-Matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.Build-Matrix.outputs.matrix) }}
    name: Checks-JS (${{ matrix.channel }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Get tags
        run: git fetch --tags origin
      - name: Setup Java JDK
        uses: actions/setup-java@v4.2.1
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'
      - name: Patch Compose versions
        run: ./scripts/lib-release.sh --patch "${{ matrix.channel }}"
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1.7.2
      - name: Run Js tests
        run: ./gradlew jsBrowserTest --warn --continue
      - name: Run Wasm tests
        run: ./gradlew wasmJsBrowserTest --warn --continue
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: 'JS JUnit Test Report (${{ matrix.channel }})'
          require_tests: true

  Checks-Jvm:
    needs: Build-Matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.Build-Matrix.outputs.matrix) }}
    name: Checks-Jvm (${{ matrix.channel }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Get tags
        run: git fetch --tags origin
      - name: Setup Java JDK
        uses: actions/setup-java@v4.2.1
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'
      - name: Patch Compose versions
        run: ./scripts/lib-release.sh --patch "${{ matrix.channel }}"
      - name: Run Android and JVM tests
        run: ./gradlew :library:testDebugUnitTest :library:jvmTest --warn --continue
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: 'JVM JUnit Test Report (${{ matrix.channel }})'
          require_tests: true

  Checks-Apple:
    needs: Build-Matrix
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.Build-Matrix.outputs.matrix) }}
    name: Checks-Apple (${{ matrix.channel }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Get tags
        run: git fetch --tags origin
      - name: Setup Java JDK
        uses: actions/setup-java@v4.2.1
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'
      - name: Patch Compose versions
        run: ./scripts/lib-release.sh --patch "${{ matrix.channel }}"
      - name: Run Apple tests
        run: ./gradlew :library:iosSimulatorArm64Test --warn --continue
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: 'Apple JUnit Test Report (${{ matrix.channel }})'
          require_tests: true
