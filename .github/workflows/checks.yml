name: Checks
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  checks: write
jobs:
  Build-Matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Parse compose-releases.toml
        id: parse
        run: |
          matrix=$(./scripts/lib-release.sh --json-matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Parsed matrix: $matrix"

  Checks-Scripts:
    runs-on: ubuntu-latest
    name: Checks-Scripts
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Compose tracker self-test (offline)
        run: python3 scripts/check-compose-updates.py --self-test

  Checks-JS:
    needs: Build-Matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.Build-Matrix.outputs.matrix) }}
    # next channel is beta — surface failures without blocking merges
    continue-on-error: ${{ matrix.channel == 'next' }}
    name: Checks-JS (${{ matrix.channel }})
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Get tags
        run: git fetch --tags origin
      - name: Setup Java JDK
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'
      - name: Patch Compose versions
        run: ./scripts/lib-release.sh --patch "${{ matrix.channel }}"
      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
      - name: Run Js tests
        # v2 installs "Chrome for Testing" (binary not necessarily named google-chrome),
        # so point Karma at the exact path instead of relying on PATH name resolution.
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: ./gradlew jsBrowserTest --warn --continue
      - name: Run Wasm tests
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: ./gradlew wasmJsBrowserTest --warn --continue
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: 'JS JUnit Test Report (${{ matrix.channel }})'
          require_tests: true

  Checks-Jvm:
    needs: Build-Matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.Build-Matrix.outputs.matrix) }}
    # next channel is beta — surface failures without blocking merges
    continue-on-error: ${{ matrix.channel == 'next' }}
    name: Checks-Jvm (${{ matrix.channel }})
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Get tags
        run: git fetch --tags origin
      - name: Setup Java JDK
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'
      - name: Patch Compose versions
        run: ./scripts/lib-release.sh --patch "${{ matrix.channel }}"
      - name: Run Android and JVM tests
        run: ./gradlew :library:testDebugUnitTest :library:jvmTest :docs-examples:compileDebugKotlinAndroid :docs-examples:compileKotlinJvm --warn --continue
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: 'JVM JUnit Test Report (${{ matrix.channel }})'
          require_tests: true

  Checks-Api:
    runs-on: ubuntu-latest
    name: Checks-Api
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Get tags
        run: git fetch --tags origin
      - name: Setup Java JDK
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'
      - name: Check public API
        run: ./gradlew :library:checkKotlinAbi

  Checks-Apple:
    needs: Build-Matrix
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.Build-Matrix.outputs.matrix) }}
    # next channel is beta — surface failures without blocking merges
    continue-on-error: ${{ matrix.channel == 'next' }}
    name: Checks-Apple (${{ matrix.channel }})
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Get tags
        run: git fetch --tags origin
      - name: Select Xcode version
        if: ${{ matrix.xcode != '' }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - name: Setup Java JDK
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'
      - name: Patch Compose versions
        run: ./scripts/lib-release.sh --patch "${{ matrix.channel }}"
      - name: Run Apple tests
        run: ./gradlew :library:iosSimulatorArm64Test --warn --continue
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: 'Apple JUnit Test Report (${{ matrix.channel }})'
          require_tests: true

  # Single aggregate gate — use this as the required status check in branch
  # protection rules instead of naming each matrix leg (which change with
  # compose-releases.toml).
  CI-Gate:
    needs: [Build-Matrix, Checks-Scripts, Checks-JS, Checks-Jvm, Checks-Apple, Checks-Api]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all checks passed
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          echo "Job results: $RESULTS"
          echo "$RESULTS" | python3 -c "
          import json, sys
          results = json.load(sys.stdin)
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              print(f'::error::Failed jobs: {failed}')
              sys.exit(1)
          print('All matrix checks passed.')
          "
