name: Track Compose versions
# Weekly check for newer upstream Compose Multiplatform releases. When a channel
# in compose-releases.toml is behind, opens/updates a PR with the bump so the
# existing Checks matrix validates it before you merge and run Release.
#
# NOTE: opening PRs with the default GITHUB_TOKEN requires
# Settings -> Actions -> General -> "Allow GitHub Actions to create and approve
# pull requests" to be enabled for the repository.
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  Track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Check for upstream Compose updates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check-compose-updates.py --write --pr-body "${RUNNER_TEMP}/pr-body.md"
      - name: Create or update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/track-compose
          base: main
          title: 'chore: track upstream Compose versions'
          body-path: ${{ runner.temp }}/pr-body.md
          commit-message: 'chore: bump Compose channels to upstream latest'
          labels: dependencies
          delete-branch: true
